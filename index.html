<body class="bg-ground text-ink font-sans antialiased">

    <section id="hero" class="hidden grid gap-6 items-start" style="grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr))"></section>

    <section id="kompass" aria-labelledby="kompass-titel" class="hidden flex-col gap-[18px]"></section>

    <section id="system-check" aria-labelledby="system-check-titel" class="hidden flex-col gap-5"></section>

        <div id="modi" role="group" class="flex flex-wrap gap-1.5 p-1 bg-white border border-line rounded-xl"></div>

      <div class="flex flex-wrap items-center gap-x-4 gap-y-2.5 px-4 py-3 bg-white border border-[#E2DFD5] rounded-xl">

      <div id="themen" class="flex flex-col gap-8"></div>

  </main>

  <footer id="fuss" class="hidden bg-ink text-[#E9E7E1]"></footer>

<script>

  };

  var PAKET = {
    haupt:    { cls: 'bg-ink text-white', icon: 'M5 11h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM7 11V7a5 5 0 0 1 10 0v4' },
    optional: { cls: 'bg-[#E6EEF8] text-[#163A66] ring-1 ring-inset ring-[#9DB6D6]', icon: 'M16 3h5v5M8 3H3v5M12 22v-8.3a4 4 0 0 0-1.17-2.87L3 3M15 9l6-6' },
    begleit:  { cls: 'bg-[#EEEDE8] text-[#3D4047] ring-1 ring-inset ring-[#CFCCC2]', icon: 'M12 5v14M5 12h14' }
  };

  var STATUS = {
    dafuer:    { badge: 'bg-[#E2F0E6] text-[#1C5E33]', dot: 'bg-[#2E7D4A]', icon: 'M20 6L9 17l-5-5' },
    vorbehalt: { badge: 'bg-[#FBEFCF] text-[#6E4A00]', dot: 'bg-[#C99A2E]', icon: 'M12 7v6M12 17h.01' },

  /* ===================== ZUSTAND ===================== */
  var state = {
    data: null,
    lang: 'de',
    q: '',
    mode: 'alle',          // 'branchen' | 'system' | 'alle'
    paketFilter: 'all',    // 'all' | 'haupt' | 'optional' | 'begleit'
    actor: 'bundesrat',
    open: { institutionell: true, 'system-check': true },
    posOpen: {},
    srcOpen: {}
  };

  /* ===================== HILFSFUNKTIONEN ===================== */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function pick(obj) { if (!obj) return ''; return obj[state.lang] || obj.de || ''; }
  function L() { return Object.assign({}, state.data.ui.de, state.data.ui[state.lang] || {}); }
  function icon(d, size, sw, extra) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) + '" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.75) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra ? ' class="' + extra + '"' : '') + '><path d="' + d + '"/></svg>';
  }
  function byId(id) { return state.data.themen.filter(function (t) { return t.id === id; })[0]; }
  function inhalt(t) { return (t.inhalt && (t.inhalt[state.lang] || t.inhalt.de)) || {}; }
  function paketBadge(pk, l, small) {
    var p = PAKET[pk] || PAKET.haupt;
    return '<span class="' + p.cls + ' inline-flex items-center gap-1.5 ' + (small ? 'text-[11px] px-2 py-[3px]' : 'text-xs px-[9px] py-1') + ' font-semibold tracking-[0.02em] rounded-full">' +
      icon(p.icon, small ? 11 : 13, 2) + esc(l[pk]) + ' · ' + esc(l[pk + 'Hint']) + '</span>';
  }
  function statusBadge(st, l) {
    var s = STATUS[st] || STATUS.offen;
    return '<span class="' + s.badge + ' inline-flex items-center gap-1 text-xs font-semibold px-[9px] py-[3px] rounded-full whitespace-nowrap">' +
      icon(s.icon, 12, 2.5) + esc(l[st] || st) + '</span>';
  }

  /* ===================== RENDER: SPRACHE & STATISCHE TEXTE ===================== */
  function renderStatic() {
    var l = L();
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-ui]').forEach(function (el) {
      var k = el.getAttribute('data-ui');
      if (l[k]) el.textContent = l[k];
    });
    var inp = $('live-suche');
    inp.placeholder = l.search;
    $('suche-loeschen').setAttribute('aria-label', l.reset);
    $('modi').setAttribute('aria-label', l.modeLabel);

    $('sprachen').innerHTML = LANGS.map(function (c) {
      var on = c === state.lang;
      return '<button type="button" data-action="lang" data-value="' + c + '" aria-pressed="' + on + '" class="' +
        (on ? 'bg-navy text-white' : 'bg-transparent text-ink hover:bg-[#EEEDE8]') +
        ' min-w-[44px] h-[38px] rounded-full text-[13px] font-semibold tracking-wide">' + c.toUpperCase() + '</button>';
    }).join('');
  }

  function renderHero() {
    var l = L();
    $('hero').innerHTML =
      '<div>' +
        '<h1 class="m-0 font-serif text-4xl sm:text-[44px] leading-[1.1] font-semibold tracking-[-0.01em] text-[#121417]">' + esc(l.heroTitle) + '</h1>' +
        '<p class="mt-4 mb-0 text-lg leading-relaxed text-[#3D4047] max-w-[60ch]">' + esc(l.heroLead) + '</p>' +
      '</div>' +
      '<aside class="bg-white border border-line rounded-xl px-5 py-[18px]">' +
        '<h2 class="m-0 mb-2 flex items-center gap-2 text-[13px] font-semibold tracking-[0.06em] uppercase text-navy">' + icon(ICONS.clock, 16, 2) + esc(l.statusTitle) + '</h2>' +
        '<p class="m-0 text-[15px] leading-relaxed">' + esc(pick(state.data.meta.status)) + '</p>' +
      '</aside>';
  }

  /* ===================== RENDER: SYSTEM-CHECK (DYNAMISCHE RECHTSÜBERNAHME) ===================== */
  function renderSystemCheck() {
    var l = L();
    var open = !!state.open['system-check'];

    var head =
      '<button type="button" data-action="toggle" data-value="system-check" aria-expanded="' + open + '" class="w-full text-left flex gap-4 items-start px-5 pt-5 pb-[18px] min-h-[44px] hover:bg-[#FCFBF8]">' +
        '<span class="flex-none w-11 h-11 rounded-[10px] bg-navy text-white flex items-center justify-center">' + icon(ICONS.scale, 22) + '</span>' +
        '<span class="flex-1 min-w-0 flex flex-col gap-2">' +
          '<span id="system-check-titel" class="font-serif text-[22px] leading-tight font-semibold text-[#121417]">Kernmechanismus: Dynamische Rechtsübernahme &amp; Volksentscheid</span>' +
          '<span class="text-[15px] leading-normal text-muted">Wie EU-Rechtsübernahme, Schweizer Parlament, Referendum und Schiedsgericht zusammenspielen.</span>' +
        '</span>' +
        '<span class="flex-none w-9 h-9 rounded-full border border-line flex items-center justify-center">' + icon(ICONS.chevron, 18, 2, 'chev' + (open ? ' rot' : '')) + '</span>' +
      '</button>';

    if (!open) {
      $('system-check').innerHTML = '<div class="bg-white border border-line rounded-2xl shadow-[0_1px_2px_rgba(0,0,0,0.04)] overflow-hidden">' + head + '</div>';
      return;
    }

    var hinweis = state.lang !== 'de'
      ? '<p class="m-0 text-[13px] text-navy bg-[#EEF2F7] px-3 py-2 rounded-lg">' + esc(l.onlyDe) + '</p>'
      : '';

    var steps = [
      { icon: ICONS.globe, tone: 'bg-[#EEF2F7] text-navy', title: 'EU-Beschluss',
        text: 'Die EU entwickelt ihr Recht weiter. Fällt ein neuer Rechtsakt in den Geltungsbereich eines Binnenmarktabkommens, muss der paritätische Gemischte Ausschuss einstimmig über dessen Übernahme entscheiden.' },
      { icon: ICONS.landmark, tone: 'bg-[#EEF2F7] text-navy', title: 'Schweizer Parlament',
        text: 'Jede Übernahme ist eine Vertragsänderung und durchläuft das reguläre staatsvertragliche Genehmigungsverfahren der Bundesversammlung – es gibt keinen Automatismus.' },
      { icon: ICONS.users, tone: 'bg-[#FBEFCF] text-[#6E4A00]', title: 'Referendum',
        text: 'Je nach Erlassform kann das Stimmvolk ein Referendum ergreifen und die Übernahme ablehnen. Erst danach wird ein Rechtsakt für die Schweiz verbindlich – oder eben nicht.' },
      { icon: ICONS.alert, tone: 'bg-[#FCF0E6] text-[#8A3D00]', title: 'Bei Nein: Ausgleichsmassnahmen',
        text: 'Lehnt die Schweiz eine fällige Übernahme ab, kann die EU – erst nach einer Verletzungsfeststellung durch das Schiedsgericht und frühestens drei Monate nach Notifizierung – verhältnismässige Ausgleichsmassnahmen in einem Binnenmarktabkommen ergreifen.' },
      { icon: ICONS.scale, tone: 'bg-[#EEEDE8] text-[#4F5259]', title: 'Schiedsgericht',
        text: 'Ein paritätisch besetztes Schiedsgericht entscheidet abschliessend über den Streitfall und prüft auf Verlangen auch die Verhältnismässigkeit der Ausgleichsmassnahmen. Der EuGH wird nur zur Auslegung von EU-Recht beigezogen – er entscheidet nie selbst.' }

      return '<div class="relative bg-white border border-[#E6E3DA] rounded-[10px] p-4 flex flex-col gap-2">' +
          (i > 0 ? '<span class="hidden lg:flex absolute -left-[18px] top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-ground border border-[#E6E3DA] items-center justify-center text-[#8A8D93]" aria-hidden="true">' + icon(ICONS.arrowRight, 13, 2.25) + '</span>' : '') +
          '<span class="inline-flex items-center gap-2">' +
            '<span class="flex-none w-8 h-8 rounded-full ' + s.tone + ' flex items-center justify-center">' + icon(s.icon, 16, 2) + '</span>' +

            '</span>' +
          '</span>' +

    var proItems = [
      'Kein Automatismus: Die Schweiz entscheidet eigenständig über jede einzelne Rechtsübernahme – inklusive Referendum.',
      'Der EuGH entscheidet nie über einen Streitfall; er legt EU-Recht nur aus, wenn das Schiedsgericht ihn dafür anruft.',
      'Ausgleichsmassnahmen sind auf die Binnenmarktabkommen beschränkt und müssen verhältnismässig sein – das Schiedsgericht prüft dies auf Verlangen.',
      'Eine automatische dreimonatige Wartefrist verhindert, dass Ausgleichsmassnahmen sofort nach der Notifizierung in Kraft treten.'
    ];
    var contraItems = [
      'Ein Volks-Nein kann einen monatelangen Schwebezustand auslösen, bis ein Streitfall vollständig beigelegt ist.',
      'Ob eine Ausgleichsmassnahme «verhältnismässig» ist, entscheidet letztlich ein Schiedsgericht – nicht direkt die Schweizer Stimmbevölkerung.',
      'Für Unternehmen und Behörden entsteht Planungsunsicherheit, solange ein Streitverfahren läuft.',
      'Kritiker befürchten, dass der politische Druck, ein Nein zu vermeiden, die faktische demokratische Freiheit einschränkt.'
    ];
    var li = function (arr) { return arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join(''); };

    var body =

        '<div><h2 class="m-0 mb-2.5 text-[13px] font-semibold tracking-[0.06em] uppercase text-white">' + esc(l.sources) + '</h2>' +
          '<ul class="m-0 pl-[18px] list-disc">' +
            '<li><a href="' + esc(m.portalUrl) + '" target="_blank" rel="noopener" class="text-[#C9D8EE] underline">admin.ch – Paket Schweiz–EU</a></li>' +
            '<li><a href="' + esc(m.edaUrl) + '" target="_blank" rel="noopener" class="text-[#C9D8EE] underline">EDA – Verhandlungsergebnisse &amp; Botschaft</a></li>' +
            '<li><a href="' + esc(m.botschaftUrl) + '" target="_blank" rel="noopener" class="text-[#C9D8EE] underline">Botschaft Paket Schweiz–EU (PDF)</a></li>' +
          '</ul></div>' +
        '<div><p class="m-0">' + esc(pick(m.redaktion)) + '</p><p class="mt-2.5 mb-0 text-[#B9B6AE]">' + esc(l.disclaimer) + '</p></div>' +
      '</div>' +
      '<div id="impressum" class="border-t border-[#33363D] max-w-[1200px] mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-x-6 gap-y-2">' +
        '<p class="m-0 text-xs text-[#B9B6AE]">' + esc(l.copyright) + '</p>' +
        '<button type="button" data-action="toggle" data-value="impressum" aria-expanded="' + open + '" aria-controls="impressum-panel" class="inline-flex items-center gap-1.5 min-h-[44px] px-1 text-[13px] font-medium text-[#C9D8EE] underline underline-offset-[3px]">' +
          esc(l.impressumLink) + icon(ICONS.chevron, 15, 2, 'chev' + (open ? ' rot' : '')) +
        '</button>' +
      '</div>' +
      panel;
  }

  function renderAll() {
    renderStatic(); renderHero(); renderSystemCheck(); renderKompass(); renderThemen(); renderFooter();
  }

  /* ===================== EVENTS ===================== */
  function toggleMap(map, id) { map[id] = !map[id]; }

  function goTo(id) {
    state.mode = 'alle'; state.q = ''; state.paketFilter = 'all'; state.open[id] = true;
    $('live-suche').value = '';
    $('suche-loeschen').classList.add('hidden'); $('suche-loeschen').classList.remove('flex');
    renderThemen();
    var el = $('thema-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn || !state.data) return;
    var v = btn.getAttribute('data-value');
    switch (btn.getAttribute('data-action')) {
      case 'lang':   state.lang = v; renderAll(); break;
      case 'actor':  state.actor = v; renderKompass(); break;
      case 'goto':   goTo(v); break;
      case 'mode':   state.mode = v; renderThemen(); break;
      case 'paket':  state.paketFilter = v; renderThemen(); break;
      case 'toggle':
        toggleMap(state.open, v);
        if (v === 'system-check') renderSystemCheck();
        else if (v === 'impressum') { renderFooter(); if (state.open.impressum) $('impressum').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        else renderThemen();
        break;
      case 'pos':    toggleMap(state.posOpen, v); renderThemen(); break;
      case 'src':    toggleMap(state.srcOpen, v); renderThemen(); break;
    }
  });

  $('live-suche').addEventListener('input', function (e) {
    state.q = e.target.value;
    var clr = $('suche-loeschen');
    clr.classList.toggle('hidden', !state.q); clr.classList.toggle('flex', !!state.q);
    if (state.data) renderThemen();
  });
  $('suche-loeschen').addEventListener('click', function () {
    state.q = ''; $('live-suche').value = '';
    this.classList.add('hidden'); this.classList.remove('flex');
    if (state.data) renderThemen();
    $('live-suche').focus();
  });

  /* ===================== DATEN LADEN ===================== */
  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      if (!data || !data.themen) throw new Error('Ungültiges Format');
      state.data = data;
      $('laden').classList.add('hidden');
      $('hero').classList.remove('hidden');
      ['system-check', 'kompass', 'themen-bereich'].forEach(function (id) { $(id).classList.remove('hidden'); $(id).classList.add('flex'); });
      $('fuss').classList.remove('hidden');
      renderAll();
    })
    .catch(function (err) {
      var fileProto = location.protocol === 'file:';
      $('laden').innerHTML =
        '<div class="bg-white border border-[#EBC7A6] rounded-xl p-5 max-w-[640px]">' +
          '<p class="m-0 font-semibold text-[#8A3D00]">themen.json konnte nicht geladen werden.</p>' +
          '<p class="mt-2 mb-0 text-[15px] leading-relaxed text-[#3D4047]">' +
            (fileProto
              ? 'Die Seite wurde per Doppelklick (file://) geöffnet. Browser blockieren dabei das Laden lokaler JSON-Dateien. Öffne die Seite in VS Code mit «Open with Live Server».'
              : 'Prüfe, ob themen.json im selben Ordner wie index.html liegt und gültiges JSON enthält.') +
          '</p><p class="mt-2 mb-0 text-xs text-[#5A5D63]">Fehler: ' + esc(err.message) + '</p>' +
        '</div>';
    });
})();
</script>
</body>
</html>
